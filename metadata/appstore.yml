# Mirror of App Store Connect metadata. Update this when you change any
# listing text in App Store Connect so `make metadata-lint` can catch
# forbidden brand terms and size violations before a submission rejection.
#
# `subtitle` contract (enforced by scripts/metadata-lint.sh):
#   - Populated string: checked for forbidden brand terms (macOS, Mac, iOS,
#     GitHub, Apple, ...) and the 30-char App Store limit.
#   - "<unset>": explicit sentinel declaring "no subtitle is live on App
#     Store Connect". The check is skipped, with an auditable log line.
#   - Empty (""): hard failure. Prior rejections happened twice because an
#     empty value silently skipped the check.
#
# `keywords` contract:
#   - Comma-separated list, <= 100 chars total (App Store hard limit).
#   - Mirror the live value; leave as "<unset>" if no keywords are live.
#
# `description` contract:
#   - Multi-line. <= 4000 chars total (App Store hard limit).
#   - Forbidden-terms check is NOT applied — product names are allowed in
#     context within the description body.
#   - Leave as "<unset>" if no description is live.

subtitle: "The pull requests manager app"

# Optimized for discoverability: no duplication with App Name / Subtitle
# ("pull", "request(s)", "manager" are already indexed from those fields),
# adds high-value adjacent terms developers actually search for.
keywords: "pr,code review,reviewer,git,diff,merge,ci,check,dashboard,issue,oncall,commit,menu bar"

# Promotional text: <= 170 chars, editable in App Store Connect without a new version.
promotional_text: "New in 1.3: convert pull requests to drafts or mark them ready, exclude noise with a right-click, and jump from a widget or notification straight to its view."

description: |
  Pull Request Pilot puts your GitHub pull request queue right in your Mac menu bar. Stay on top of code reviews without switching to the browser.

  Create custom views to organize pull requests the way you work: needs my review, my PRs, my drafts, recently merged, or build your own with any GitHub search query, issues included. See labels, review status, checks and recent activity at a glance, and act from the list: open in the browser, convert to draft or mark ready for review, or exclude a repository, author or label from a view.

  Add desktop widgets to keep your review queue visible at all times, from a simple count to a list of your top open pull requests, in several sizes. Click a widget to jump straight to its view.

  Get notified when new pull requests appear in any of your views, and click the notification to open them.

  Features:
  - Menu bar app with quick access to your review queue
  - Custom views with full GitHub search support, for pull requests and issues
  - Detail panel with activity timeline, comments, reviewers and check statuses, including required checks
  - Convert a pull request to draft or mark it ready for review
  - Exclude repositories, authors or labels from a view with a right-click
  - Hide pull requests you have already reviewed
  - Desktop widgets in small, medium and large sizes
  - Notifications per view
  - Auto-refresh on a configurable interval
  - Local git directory scanning to open pull requests in VS Code, iTerm or cmux
  - Keyboard shortcuts and menu commands for views and refresh
  - Secure authentication via a token stored in the Keychain
  - Launch at login
  - No account required

  No external dependencies, no tracking, no data collection.
