# Mirror of App Store Connect metadata. Update this when you change
# subtitle/promotional text in App Store Connect so `make metadata-lint`
# can catch forbidden brand terms before another submission rejection.
#
# `subtitle` contract (enforced by scripts/metadata-lint.sh):
#   - Populated string: checked for forbidden brand terms (macOS, Mac, iOS,
#     GitHub, Apple, ...) and the 30-char App Store limit. This is the
#     normal case — mirror the live subtitle here verbatim.
#   - "<unset>": explicit sentinel declaring "no subtitle is live on App
#     Store Connect". The check is skipped, with an auditable log line.
#     Use this ONLY if you have verified the live listing.
#   - Empty (""): hard failure. Prior rejections happened twice because an
#     empty value silently skipped the check. Choose one of the two above.

subtitle: ""
