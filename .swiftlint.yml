# SwiftLint configuration for Pull Request Pilot.
#
# Every custom rule here exists to freeze a bug class that has already shipped
# once — not to enforce style. Rationale per rule: see this file's commit history.

included:
  - PullRequestPilot
  - PullRequestPilotTests
  - PullRequestPilotWidget
  - Shared

excluded:
  - .build
  - PullRequestPilot.xcodeproj
  - GitHubDashboard.xcodeproj
  - PullRequestPilot/Resources

# Only enable the rules we explicitly want. Built-in style rules (line length,
# identifier naming, etc.) are not this file's job — the custom rule ledger is.
disabled_rules:
  - trailing_whitespace
  - trailing_newline
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - type_name
  - identifier_name
  - cyclomatic_complexity
  - large_tuple
  - nesting
  - unused_closure_parameter
  - opening_brace
  - comma
  - trailing_comma
  - colon
  - multiple_closures_with_trailing_closure
  - redundant_string_enum_value
  - non_optional_string_data_conversion
  - blanket_disable_command
  - for_where
  - static_over_final_class
  - void_function_in_ternary
  - shorthand_operator
  - unneeded_break_in_switch
  - inclusive_language
  - legacy_hashing
  - syntactic_sugar

opt_in_rules:
  - force_unwrapping          # `foo!` — use guard/if let or try #require.
  - force_try                 # `try!` — use do/try/catch.

# force_cast is enabled by default.

custom_rules:

  # -------------------------------------------------------------------------
  # Crash-safety rules (shipped bugs → error)
  # -------------------------------------------------------------------------

  fatal_error_forbidden:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    name: "fatalError() forbidden in production"
    regex: '\bfatalError\s*\('
    message: "No fatalError() in production. Throw a typed error or surface via EventCenter."
    severity: error

  precondition_failure_forbidden:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    name: "preconditionFailure() forbidden in production"
    regex: '\bpreconditionFailure\s*\('
    message: "No preconditionFailure() — it hides crashes in lazy closures (CLAUDE.md)."
    severity: error

  dictionary_unique_keys_api_data:
    name: "Dictionary(uniqueKeysWithValues:) crashes on duplicates"
    regex: 'Dictionary\(uniqueKeysWithValues:'
    message: "Shipped crash: duplicate keys trap. Use Dictionary(_, uniquingKeysWith:) or reduce(into:)."
    severity: error

  # -------------------------------------------------------------------------
  # Concurrency rules
  # -------------------------------------------------------------------------

  unchecked_sendable_production:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    name: "@unchecked Sendable forbidden in production"
    regex: '@unchecked\s+Sendable'
    message: "No @unchecked Sendable. Use actor, @MainActor, or a lock-backed Sendable."
    severity: error

  # -------------------------------------------------------------------------
  # Error-handling rules
  # -------------------------------------------------------------------------

  bare_catch_block:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    name: "Bare catch {} swallows errors"
    # Also `catch { return nil }` and friends: the same swallow with a default.
    # A plain `catch { return }` stays legal: it's how a Task.sleep loop exits
    # on cancellation.
    regex: 'catch\s*\{\s*(return\s+(nil|false|\[\]|\[:\])\s*)?\}'
    message: "Bare catch swallows CancellationError and decode failures. Log via os.Logger or rethrow."
    severity: error

  # -------------------------------------------------------------------------
  # Dependency-injection rules
  # -------------------------------------------------------------------------

  user_defaults_standard_outside_appstate:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
      - "PullRequestPilotTests/.*\\.swift"
    excluded:
      - "PullRequestPilot/App/AppState\\.swift"
    name: "UserDefaults.standard banned outside AppState"
    # Also the `defaults: UserDefaults = .standard` default-argument form.
    regex: 'UserDefaults\s*\.\s*standard|UserDefaults\s*=\s*\.standard'
    message: "Use the injected UserDefaults — .standard bypasses DI and the app-group suite."
    severity: error

  # -------------------------------------------------------------------------
  # Product rules (project-specific semantics)
  # -------------------------------------------------------------------------

  is_pr_auto_injection:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    name: "Do not hard-code is:pr"
    # A standalone literal, or one appended to a query (`" is:pr"`, `\(query) is:pr`).
    regex: '"\s*is:\s*pr\s*"|"\s+is:\s*pr\b|\)\s+is:\s*pr\b'
    message: "Never hard-code is:pr — the app intentionally supports issue queries too."
    severity: error

  logger_subsystem:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    excluded:
      - "Shared/Logger\\+Category\\.swift"
    name: "Logger outside the bundle-ID subsystem"
    regex: 'Logger\(\s*subsystem:|\bos_log\('
    message: "Use Logger(category:). Export Logs filters on the bundle-ID subsystem; any other subsystem is missing from support bundles."
    severity: error

  audit_finding_reference:
    name: "Audit finding IDs in source"
    regex: 'FINDING-[0-9]+'
    message: "Finding IDs restart every audit. State the reason in the comment; put the ID in the commit message."
    severity: error

  # -------------------------------------------------------------------------
  # Layering (CLAUDE.md → Architecture): one module, so only these rules
  # keep the dependency arrows pointing Features → Infrastructure → Domain.
  # -------------------------------------------------------------------------

  domain_imports_foundation_only:
    included:
      - "PullRequestPilot/Domain/.*\\.swift"
    name: "Domain depends on Foundation only"
    regex: '^import (?!Foundation\b)\w+'
    message: "Domain models are plain data: import Foundation only."
    severity: error

  infrastructure_knows_no_ui:
    included:
      - "PullRequestPilot/Infrastructure/.*\\.swift"
    name: "Infrastructure holds no views and names no app or feature types"
    regex: '^import SwiftUI|\b(EventCenter|AppState|\w+ViewModel)\b'
    match_kinds: [keyword, identifier, typeidentifier]
    message: "Infrastructure serves Features; views belong in Features/, and events go through EventReporter (Domain)."
    severity: error

  dashboard_feature_isolated:
    included:
      - "PullRequestPilot/Features/Dashboard/.*\\.swift"
    name: "Dashboard names no other feature"
    regex: '\b(SettingsView|SettingsViewModel|PRDetailView|PRDetailViewModel|ReviewQueueView|ReviewQueueViewModel)\b'
    match_kinds: [identifier, typeidentifier]
    message: "Features never reference each other; compose them in App/ or in the ReviewQueue screen."
    severity: error

  settings_feature_isolated:
    included:
      - "PullRequestPilot/Features/Settings/.*\\.swift"
    name: "Settings names no other feature"
    regex: '\b(DashboardViewModel|PRDetailView|PRDetailViewModel|ReviewQueueView|ReviewQueueViewModel)\b'
    match_kinds: [identifier, typeidentifier]
    message: "Settings reaches the dashboard through DashboardActionsProtocol, which AppState conforms."
    severity: error

  pull_request_detail_feature_isolated:
    included:
      - "PullRequestPilot/Features/PRDetail/.*\\.swift"
    name: "PRDetail names no other feature"
    regex: '\b(SettingsView|SettingsViewModel|DashboardViewModel|ReviewQueueView|ReviewQueueViewModel)\b'
    match_kinds: [identifier, typeidentifier]
    message: "Features never reference each other; compose them in App/ or in the ReviewQueue screen."
    severity: error

  # -------------------------------------------------------------------------
  # App Store / sandbox rules
  # -------------------------------------------------------------------------

  subprocess_forbidden:
    name: "Subprocess spawning forbidden (sandbox)"
    regex: '\bProcess\s*\(\s*\)|\bNSTask\b|"/bin/sh"|"/usr/bin/env"'
    message: "App Sandbox forbids subprocess spawning — automatic App Store rejection."
    severity: error

  hardcoded_sandbox_unsafe_path:
    included:
      - "PullRequestPilot/.*\\.swift"
      - "PullRequestPilotWidget/.*\\.swift"
      - "Shared/.*\\.swift"
    name: "Hardcoded sandbox-unsafe path"
    regex: '"(~/|/tmp/|/usr/local/|/Users/)'
    message: "Sandbox-unsafe hardcoded path. Use NSOpenPanel or the app group container."
    severity: error
