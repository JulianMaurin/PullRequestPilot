name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# An explicit bash runs steps with pipefail, so a failing xcodebuild fails the
# step even when piped into xcbeautify.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: scripts/install-tools.sh swiftlint >> "$GITHUB_PATH"
      - name: Lint
        run: make lint SWIFTLINT_FLAGS="--reporter github-actions-logging"

  scripts-and-workflows:
    name: ShellCheck and actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: scripts/install-tools.sh actionlint >> "$GITHUB_PATH"
      - name: ShellCheck
        run: make shellcheck
      - name: actionlint
        run: make actionlint

  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Keep in step with the Xcode used locally; also pinned in codeql.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # metadata-lint compares the versions against the last tag.
          fetch-depth: 0
      - name: Install SwiftLint and XcodeGen
        run: scripts/install-tools.sh swiftlint xcodegen >> "$GITHUB_PATH"
      - name: Generated project is up to date
        run: |
          xcodegen generate
          if [[ -n "$(git status --porcelain -- PullRequestPilot.xcodeproj)" ]]; then
            git status --short -- PullRequestPilot.xcodeproj
            echo "::error::PullRequestPilot.xcodeproj differs from project.yml. Run xcodegen generate and commit the result."
            exit 1
          fi
      - name: App Store metadata
        run: make metadata-lint
        env:
          ALLOW_RELEASED_MARKETING_VERSION: "1"
      # Compiles the Release configuration like `make build`; nothing is
      # archived, uploaded or tagged.
      - name: Build (Release configuration, ad-hoc signed)
        run: >-
          make build
          XCODEBUILD_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual"
          XCB_FILTER="xcbeautify --renderer github-actions"
      - name: Signature, sandbox and entitlements
        run: make bundle-check

  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftLint and XcodeGen
        run: scripts/install-tools.sh swiftlint xcodegen >> "$GITHUB_PATH"
      # Unsigned, the test host runs without the sandbox or an app group.
      - name: Test
        run: >-
          make test
          XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
          XCB_FILTER="xcbeautify --renderer github-actions"
      - name: Summary
        if: ${{ !cancelled() }}
        run: scripts/test-summary.sh .build/TestResults.xcresult >> "$GITHUB_STEP_SUMMARY"
      - name: Upload result bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults.xcresult
          path: .build/TestResults.xcresult
          retention-days: 7
