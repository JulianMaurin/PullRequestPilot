name: PullRequestPilot
options:
  bundleIdPrefix: com.pullrequestpilot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FNR3B372S8
    ENABLE_HARDENED_RUNTIME: YES
    # "Zero warnings" enforced by the compiler, not by memory.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Single source for both targets: App Store Connect rejects an appex
    # whose versions differ from its containing app.
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  PullRequestPilot:
    type: application
    platform: macOS
    sources:
      - PullRequestPilot
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pullrequestpilot.app
        CODE_SIGN_ENTITLEMENTS: PullRequestPilot/Resources/PullRequestPilot.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: PullRequestPilot/Resources/Info.plist
      properties:
        CFBundleName: Pull Request Pilot
        CFBundleDisplayName: Pull Request Pilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.pullrequestpilot.app
            CFBundleURLSchemes:
              - pullrequestpilot
    entitlements:
      path: PullRequestPilot/Resources/PullRequestPilot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.pullrequestpilot.shared
    dependencies:
      - target: PullRequestPilotWidgetExtension
        embed: true

  PullRequestPilotWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - PullRequestPilotWidget
      - Shared
    info:
      path: PullRequestPilotWidget/Info.plist
      properties:
        CFBundleDisplayName: Pull Request Pilot Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pullrequestpilot.app.widget
        CODE_SIGN_ENTITLEMENTS: PullRequestPilotWidget/PullRequestPilotWidget.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: PullRequestPilotWidget/PullRequestPilotWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.pullrequestpilot.shared

  PullRequestPilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PullRequestPilotTests
        excludes:
          - ".swiftlint.yml"
    dependencies:
      - target: PullRequestPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pullrequestpilot.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PullRequestPilot:
    build:
      targets:
        PullRequestPilot: all
        PullRequestPilotWidgetExtension: all
        PullRequestPilotTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: GITHUB_TOKEN
          value: $(GITHUB_TOKEN)
          isEnabled: true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PullRequestPilotTests
    archive:
      config: Release
