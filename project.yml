name: PullRequestPilot
options:
  bundleIdPrefix: com.pullrequestpilot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FNR3B372S8

targets:
  PullRequestPilot:
    type: application
    platform: macOS
    sources:
      - PullRequestPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pullrequestpilot.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Pull Request Pilot
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: PullRequestPilot/Resources/PullRequestPilot.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: PullRequestPilot/Resources/PullRequestPilot.entitlements
    dependencies:
      - target: PullRequestPilotWidgetExtension
        embed: true

  PullRequestPilotWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - PullRequestPilotWidget
    info:
      path: PullRequestPilotWidget/Info.plist
      properties:
        CFBundleDisplayName: Pull Request Pilot Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pullrequestpilot.app.widget
        CODE_SIGN_ENTITLEMENTS: PullRequestPilotWidget/PullRequestPilotWidget.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    entitlements:
      path: PullRequestPilotWidget/PullRequestPilotWidget.entitlements

  PullRequestPilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PullRequestPilotTests
    dependencies:
      - target: PullRequestPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pullrequestpilot.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PullRequestPilot:
    build:
      targets:
        PullRequestPilot: all
        PullRequestPilotWidgetExtension: all
        PullRequestPilotTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: GITHUB_TOKEN
          value: $(GITHUB_TOKEN)
          isEnabled: true
    test:
      config: Debug
      targets:
        - PullRequestPilotTests
    archive:
      config: Release
